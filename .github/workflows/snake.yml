name: Generate Snake

on:
  # Her gece saat 00:00'da otomatik çalışır
  schedule:
    - cron: "0 0 * * *" 
  
  # İstediğiniz zaman manuel olarak Actions sekmesinden çalıştırabilirsiniz
  workflow_dispatch:

  # Ana branch'e her bir şey yüklediğinizde güncellenir
  push:
    branches:
    - main
    - master

jobs:
  build:
    runs-on: ubuntu-latest
    # Burası kritik: İzinleri eklemezsek dosya kaydedemez ve bozulur
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Generate Snake Animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: talha-dogan
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0077B5&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#0077B5

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
